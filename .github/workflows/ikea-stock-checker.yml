name: IKEA Stock Checker
on:
  schedule:
    # Runs daily at 9:00 AM UTC (adjust timezone as needed)
    - cron: '0 9 * * *'
  # Allows manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Check IKEA Stock
        id: stock-check
        run: |
          # Define products to check
          products=("40573285" "89542669")
          all_messages=""
          has_any_stock=false
          
          for product in "${products[@]}"; do
            echo "Checking product: $product"
            
            # Call IKEA API to get all store stocks for this product
            response=$(curl -s -X POST \
              "https://www.ikea.com.tr/_ws/general.aspx/CheckStoreStocks" \
              -H "Content-Type: application/json" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              -d "{\"sprCode\": $product}")
            
            echo "API Response for $product: $response"
            
            # Extract store information using jq for this product
            stores_in_stock=$(echo "$response" | jq -r '.d.Data.StatusList[] | select(.Status == 2 and .StoreType == 1) | .StoreTitle' | tr '\n' ',' | sed 's/,$//')
            stores_out_of_stock=$(echo "$response" | jq -r '.d.Data.StatusList[] | select(.Status == 0 and .StoreType == 1) | .StoreTitle' | tr '\n' ',' | sed 's/,$//')
            online_status=$(echo "$response" | jq -r '.d.Data.StatusList[] | select(.StoreTitle == "İNTERNET MAĞAZASI") | .StockText')
            
            # Count stores for this product
            in_stock_count=$(echo "$stores_in_stock" | grep -o ',' | wc -l)
            if [ ! -z "$stores_in_stock" ]; then
              in_stock_count=$((in_stock_count + 1))
            else
              in_stock_count=0
            fi
            
            out_stock_count=$(echo "$stores_out_of_stock" | grep -o ',' | wc -l)
            if [ ! -z "$stores_out_of_stock" ]; then
              out_stock_count=$((out_stock_count + 1))
            else
              out_stock_count=0
            fi
            
            echo "Product $product - Stores in stock: $stores_in_stock"
            echo "Product $product - Stores out of stock: $stores_out_of_stock"
            echo "Product $product - Online status: $online_status"
            echo "Product $product - In stock count: $in_stock_count"
            
            # Build message for this product
            product_message=""
            if [ "$in_stock_count" -gt 0 ]; then
              has_any_stock=true
              product_message="🎉 *Ürün $product - STOKTA!*%0A"
              product_message="${product_message}📊 *Online:* $online_status%0A"
              
              if [ ! -z "$stores_in_stock" ]; then
                product_message="${product_message}🟢 *Stokta ($in_stock_count):*%0A"
                IFS=',' read -ra STORES <<< "$stores_in_stock"
                for store in "${STORES[@]}"; do
                  product_message="${product_message}   ✅ $store%0A"
                done
              fi
            else
              product_message="😞 *Ürün $product - STOKTA YOK*%0A"
              product_message="${product_message}📊 *Online:* $online_status%0A"
            fi
            
            # Add to all messages
            if [ ! -z "$all_messages" ]; then
              all_messages="${all_messages}%0A─────────────────────%0A%0A${product_message}"
            else
              all_messages="$product_message"
            fi
          done
          
          # Set outputs
          echo "has_any_stock=$has_any_stock" >> $GITHUB_OUTPUT
          echo "all_messages=$all_messages" >> $GITHUB_OUTPUT

      - name: Send Telegram Notification
        if: always() # Send notification regardless of stock status
        run: |
          # Format timestamp
          timestamp=$(date '+%Y-%m-%d %H:%M:%S UTC')
          
          # Create message based on stock status
          if [ "${{ steps.stock-check.outputs.has_any_stock }}" = "true" ]; then
            message="🎉 *IKEA STOK KONTROL SONUÇLARI* 🎉%0A%0A"
            message="${message}🕐 *Kontrol Zamanı:* ${timestamp}%0A%0A"
            message="${message}${{ steps.stock-check.outputs.all_messages }}%0A%0A"
            message="${message}🔗 *Hızlı Link:* https://www.ikea.com.tr/%0A%0A"
            message="${message}⚡ *Acil Eylem:* Stokta olan mağazalardan sipariş ver!"
          else
            message="😞 *IKEA STOK KONTROL SONUÇLARI* 😞%0A%0A"
            message="${message}🕐 *Kontrol Zamanı:* ${timestamp}%0A%0A"
            message="${message}${{ steps.stock-check.outputs.all_messages }}%0A%0A"
            message="${message}💡 *İpucu:* Yarın tekrar kontrol edeceğim!"
          fi
          
          # Send to Telegram
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${message}" \
            -d "parse_mode=Markdown"

      - name: Log Results
        if: always()
        run: |
          echo "=== IKEA Multi-Product Stock Check Results ==="
          echo "Has any stock: ${{ steps.stock-check.outputs.has_any_stock }}"
          echo "All messages: ${{ steps.stock-check.outputs.all_messages }}"
          echo "Timestamp: $(date)"
