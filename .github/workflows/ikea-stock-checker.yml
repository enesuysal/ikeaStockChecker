name: IKEA Stock Checker
on:
  schedule:
    # Runs daily at 9:00 AM UTC (adjust timezone as needed)
    - cron: '0 9 * * *'
  # Allows manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Check IKEA Stock
        id: stock-check
        run: |
          # Call IKEA API to get all store stocks
          response=$(curl -s -X POST \
            "https://www.ikea.com.tr/_ws/general.aspx/CheckStoreStocks" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -d '{
              "sprCode": 40573285
            }')
          
          echo "API Response: $response"
          
          # Extract store information using jq
          stores_in_stock=$(echo "$response" | jq -r '.d.Data.StatusList[] | select(.Status == 2 and .StoreType == 1) | .StoreTitle' | tr '\n' ',' | sed 's/,$//')
          stores_out_of_stock=$(echo "$response" | jq -r '.d.Data.StatusList[] | select(.Status == 0 and .StoreType == 1) | .StoreTitle' | tr '\n' ',' | sed 's/,$//')
          online_status=$(echo "$response" | jq -r '.d.Data.StatusList[] | select(.StoreTitle == "İNTERNET MAĞAZASI") | .StockText')
          
          # Count stores
          in_stock_count=$(echo "$stores_in_stock" | grep -o ',' | wc -l)
          if [ ! -z "$stores_in_stock" ]; then
            in_stock_count=$((in_stock_count + 1))
          else
            in_stock_count=0
          fi
          
          out_stock_count=$(echo "$stores_out_of_stock" | grep -o ',' | wc -l)
          if [ ! -z "$stores_out_of_stock" ]; then
            out_stock_count=$((out_stock_count + 1))
          else
            out_stock_count=0
          fi
          
          echo "Stores in stock: $stores_in_stock"
          echo "Stores out of stock: $stores_out_of_stock"
          echo "Online status: $online_status"
          echo "In stock count: $in_stock_count"
          echo "Out of stock count: $out_stock_count"
          
          # Set outputs for next step
          echo "stores_in_stock=$stores_in_stock" >> $GITHUB_OUTPUT
          echo "stores_out_of_stock=$stores_out_of_stock" >> $GITHUB_OUTPUT
          echo "online_status=$online_status" >> $GITHUB_OUTPUT
          echo "in_stock_count=$in_stock_count" >> $GITHUB_OUTPUT
          echo "out_stock_count=$out_stock_count" >> $GITHUB_OUTPUT
          echo "full_response=$response" >> $GITHUB_OUTPUT
          
          # Determine alert level
          if [ "$in_stock_count" -gt 0 ]; then
            echo "alert_level=IN_STOCK" >> $GITHUB_OUTPUT
          else
            echo "alert_level=OUT_OF_STOCK" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram Notification
        if: always() # Send notification regardless of stock status
        run: |
          # Format timestamp
          timestamp=$(date '+%Y-%m-%d %H:%M:%S UTC')
          
          # Create message based on stock status
          if [ "${{ steps.stock-check.outputs.alert_level }}" = "IN_STOCK" ]; then
            message="🎉 *IKEA ÜRÜNÜ STOKTA!* 🎉%0A%0A"
            message="${message}📦 *Ürün Kodu:* 40573285%0A"
            message="${message}📊 *Online Durum:* ${{ steps.stock-check.outputs.online_status }}%0A"
            message="${message}🕐 *Kontrol Zamanı:* ${timestamp}%0A%0A"
            
            # Add available stores
            if [ ! -z "${{ steps.stock-check.outputs.stores_in_stock }}" ]; then
              message="${message}� *Stokta Olan Mağazalar (${{ steps.stock-check.outputs.in_stock_count }}):*%0A"
              IFS=',' read -ra STORES <<< "${{ steps.stock-check.outputs.stores_in_stock }}"
              for store in "${STORES[@]}"; do
                message="${message}   ✅ $store%0A"
              done
              message="${message}%0A"
            fi
            
            # Add out of stock stores
            if [ ! -z "${{ steps.stock-check.outputs.stores_out_of_stock }}" ]; then
              message="${message}🔴 *Stokta Olmayan Mağazalar (${{ steps.stock-check.outputs.out_stock_count }}):*%0A"
              IFS=',' read -ra STORES <<< "${{ steps.stock-check.outputs.stores_out_of_stock }}"
              for store in "${STORES[@]}"; do
                message="${message}   ❌ $store%0A"
              done
              message="${message}%0A"
            fi
            
            message="${message}� *Hızlı Link:* https://www.ikea.com.tr/%0A%0A"
            message="${message}⚡ *Acil Eylem:* Stokta olan mağazalardan sipariş ver!"
          else
            message="😞 *IKEA Stok Kontrolü* 😞%0A%0A"
            message="${message}📦 *Ürün Kodu:* 40573285%0A"
            message="${message}📊 *Online Durum:* ${{ steps.stock-check.outputs.online_status }}%0A"
            message="${message}🕐 *Kontrol Zamanı:* ${timestamp}%0A%0A"
            message="${message}� *Hiçbir mağazada stok yok*%0A%0A"
            message="${message}💡 *İpucu:* Yarın tekrar kontrol edeceğim!"
          fi
          
          # Send to Telegram
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${message}" \
            -d "parse_mode=Markdown"

      - name: Log Results
        if: always()
        run: |
          echo "=== IKEA Stock Check Results ==="
          echo "Stores in stock: ${{ steps.stock-check.outputs.stores_in_stock }}"
          echo "Stores out of stock: ${{ steps.stock-check.outputs.stores_out_of_stock }}"
          echo "Online status: ${{ steps.stock-check.outputs.online_status }}"
          echo "In stock count: ${{ steps.stock-check.outputs.in_stock_count }}"
          echo "Out of stock count: ${{ steps.stock-check.outputs.out_stock_count }}"
          echo "Alert Level: ${{ steps.stock-check.outputs.alert_level }}"
          echo "Timestamp: $(date)"
          echo "Full API Response: ${{ steps.stock-check.outputs.full_response }}"