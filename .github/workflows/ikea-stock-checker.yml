name: IKEA Stock Checker
on:
  schedule:
    # Runs daily at 9:00 AM UTC (adjust timezone as needed)
    - cron: '0 9 * * *'
  # Allows manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Check IKEA Stock
        id: stock-check
        run: |
          # Call IKEA API
          response=$(curl -s -X POST \
            "https://www.ikea.com.tr/en/_ws/general.aspx/CheckStock" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -d '{
              "stockCode": "40573285",
              "storeCode": "331"
            }')
          
          echo "API Response: $response"
          
          # Extract status using jq
          status=$(echo "$response" | jq -r '.d.Data.Status // "Unknown"')
          stock_text=$(echo "$response" | jq -r '.d.Data.StockText // "No info"')
          
          echo "Stock Status: $status"
          echo "Stock Text: $stock_text"
          
          # Set outputs for next step
          echo "status=$status" >> $GITHUB_OUTPUT
          echo "stock_text=$stock_text" >> $GITHUB_OUTPUT
          echo "full_response=$response" >> $GITHUB_OUTPUT
          
          # Determine emoji and message
          if [ "$status" = "InStock" ] || [ "$status" = "LowStock" ]; then
            echo "emoji=🟢" >> $GITHUB_OUTPUT
            echo "alert_level=IN_STOCK" >> $GITHUB_OUTPUT
          elif [ "$status" = "NoStock" ]; then
            echo "emoji=🔴" >> $GITHUB_OUTPUT  
            echo "alert_level=OUT_OF_STOCK" >> $GITHUB_OUTPUT
          else
            echo "emoji=🟡" >> $GITHUB_OUTPUT
            echo "alert_level=UNKNOWN" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram Notification
        if: always() # Send notification regardless of stock status
        run: |
          # Format timestamp
          timestamp=$(date '+%Y-%m-%d %H:%M:%S UTC')
          
          # Create message based on stock status
          if [ "${{ steps.stock-check.outputs.alert_level }}" = "IN_STOCK" ]; then
            message="🎉 *IKEA ÜRÜNÜ STOKTA!* 🎉%0A%0A"
            message="${message}📦 *Ürün Kodu:* 40573285%0A"
            message="${message}🏪 *Mağaza Kodu:* 331%0A" 
            message="${message}📊 *Durum:* ${{ steps.stock-check.outputs.status }}%0A"
            message="${message}🕐 *Kontrol Zamanı:* ${timestamp}%0A%0A"
            message="${message}🔗 *Hızlı Link:* https://www.ikea.com.tr/%0A%0A"
            message="${message}⚡ *Acil Eylem:* Web sitesini kontrol et ve hemen sipariş ver!"
          elif [ "${{ steps.stock-check.outputs.alert_level }}" = "OUT_OF_STOCK" ]; then
            message="❌ *IKEA Stok Kontrolü* ❌%0A%0A"
            message="${message}📦 *Ürün Kodu:* 40573285%0A"
            message="${message}🏪 *Mağaza Kodu:* 331%0A"
            message="${message}📊 *Durum:* Hala stokta yok%0A"
            message="${message}🕐 *Kontrol Zamanı:* ${timestamp}%0A%0A"
            message="${message}💡 *İpucu:* Yarın tekrar kontrol edeceğim!"
          else
            message="⚠️ *IKEA Stok Kontrolü - Sorun* ⚠️%0A%0A"
            message="${message}📦 *Ürün Kodu:* 40573285%0A"
            message="${message}🏪 *Mağaza Kodu:* 331%0A"
            message="${message}📊 *Durum:* ${{ steps.stock-check.outputs.status }}%0A"
            message="${message}🕐 *Kontrol Zamanı:* ${timestamp}%0A%0A"
            message="${message}🔍 *Not:* Beklenmeyen yanıt - manuel kontrol edin"
          fi
          
          # Send to Telegram
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${message}" \
            -d "parse_mode=Markdown"

      - name: Log Results
        if: always()
        run: |
          echo "=== IKEA Stock Check Results ==="
          echo "Status: ${{ steps.stock-check.outputs.status }}"
          echo "Alert Level: ${{ steps.stock-check.outputs.alert_level }}"
          echo "Stock Text: ${{ steps.stock-check.outputs.stock_text }}"
          echo "Timestamp: $(date)"
          echo "Full API Response: ${{ steps.stock-check.outputs.full_response }}"